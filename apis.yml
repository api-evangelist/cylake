aid: cylake
name: Cylake
description: 'Cylake is an AI-native cybersecurity company founded in 2026 by Nir Zuk, Wilson Xu, and
  Ehud (Udi) Shamir — veterans of Palo Alto Networks — to deliver complete, data-driven security for the
  world''s largest and most regulated organizations that require total data sovereignty. Its platform
  combines hardware and software with agentic workflows on a single, sovereign data foundation, running
  on-premises or in a private cloud with no dependence on public cloud or external AI services. Cylake
  launched publicly in March 2026 with a $45M seed round led by Greylock Partners (with IQT participating),
  is being built alongside several design partners, and plans general availability in early 2027. As of
  this writing Cylake does not publish a public API, developer portal, or SDKs — this profile tracks the
  company''s identity and public surface pending an API program.'
